name: Release

# Two ways to release:
#
#   1. Push a tag `vX.Y.Z` manually (classic flow).
#
#   2. Actions → Release → Run workflow → pick a bump type.
#      The version auto-increments from the latest `v*` tag
#      (patch: 1.3.0 → 1.3.1 / minor: 1.3.1 → 1.4.0 / major: 1.4.0 → 2.0.0),
#      or type an explicit version to override.
#      The workflow commits the pom bump, tags, builds, and publishes —
#      no manual version typing needed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (auto-increments from the latest v* tag)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version_override:
        description: 'Optional: explicit version (e.g. 1.4.0). Overrides the bump choice.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # ── 1. Resolve the version ──────────────────────────────────────────
  # tag push  → extract from the tag name
  # dispatch  → compute the next version, bump pom.xml, commit, tag, push
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags for version computation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java (for mvn versions:set)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: 'maven'

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OVERRIDE="${{ inputs.version_override }}"
            if [ -n "$OVERRIDE" ]; then
              NEW="$OVERRIDE"
              echo "Using explicit version override: $NEW"
            else
              LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
              LATEST="${LATEST#v}"
              if [ -z "$LATEST" ]; then LATEST="0.0.0"; fi
              echo "Latest released version: $LATEST"
              IFS=. read -r MA MI PA <<< "$LATEST"
              MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
              case "${{ inputs.bump }}" in
                major) MA=$((MA+1)); MI=0; PA=0 ;;
                minor) MI=$((MI+1)); PA=0 ;;
                *)     PA=$((PA+1)) ;;
              esac
              NEW="$MA.$MI.$PA"
            fi

            echo "New version: $NEW"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            mvn versions:set "-DnewVersion=$NEW" "-DgenerateBackupPoms=false" -B

            git add pom.xml
            git commit -m "chore(release): v$NEW"
            git tag "v$NEW"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
            git push origin "v$NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
          else
            V="${{ github.ref_name }}"
            V="${V#v}"
            echo "Tag push — version: $V"
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build release artifacts (Windows EXE + ZIP) ──────────────────
  build:
    name: Build Release Artifacts
    needs: version
    runs-on: windows-latest

    outputs:
      version: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: 'maven'

      - name: Set version in pom.xml
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Write-Host "Setting version to: $version"
          mvn versions:set "-DnewVersion=$version" "-DgenerateBackupPoms=false" -B

      - name: Build package (EXE + ZIP)
        run: mvn clean package -B

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsbThief-${{ needs.version.outputs.version }}-exe
          path: target/UsbThief-*.exe
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsbThief-${{ needs.version.outputs.version }}-zip
          path: target/UsbThief-*.zip
          retention-days: 30

  # ── 3. Publish the GitHub Release ───────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v8
        with:
          name: UsbThief-${{ needs.version.outputs.version }}-exe
          path: ./artifacts/

      - name: Download ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: UsbThief-${{ needs.version.outputs.version }}-zip
          path: ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: UsbThief ${{ needs.version.outputs.version }}
          body: |
            ## UsbThief ${{ needs.version.outputs.version }}

            ### Downloads
            - **UsbThief-${{ needs.version.outputs.version }}.zip** - Full distribution (EXE + custom runtime)
            - **UsbThief-${{ needs.version.outputs.version }}.exe** - Standalone executable

            ### System Requirements
            - Windows 10/11 (64-bit)
            - No Java installation required (custom JRE included)
          files: |
            ./artifacts/UsbThief-*.exe
            ./artifacts/UsbThief-*.zip
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
