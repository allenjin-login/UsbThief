name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*-java11'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build Release Artifacts
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -match '^v') {
            $version = $version.Substring(1)
          }
          if ($version -match '-java11$') {
            $version = $version.Substring(0, $version.Length - 7)
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "is_java11=${{ contains(github.ref_name, '-java11') }}" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Setup Java 11
        if: contains(github.ref_name, '-java11')
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: 'maven'

      - name: Setup Java 25
        if: "!contains(github.ref_name, '-java11')"
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: 'maven'

      - name: Update version in pom.xml
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Write-Host "Setting version to: $version"
          mvn versions:set "-DnewVersion=$version" "-DgenerateBackupPoms=false" -B

      - name: Build package (EXE + ZIP)
        run: mvn clean package -B

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbThief-${{ steps.version.outputs.version }}-exe
          path: target/UsbThief-*.exe
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbThief-${{ steps.version.outputs.version }}-zip
          path: target/UsbThief-*.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: UsbThief-${{ needs.build.outputs.version }}-exe
          path: ./artifacts/

      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: UsbThief-${{ needs.build.outputs.version }}-zip
          path: ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: UsbThief ${{ needs.build.outputs.version }}
          body: |
            ## UsbThief ${{ needs.build.outputs.version }}

            ### Downloads
            - **UsbThief-${{ needs.build.outputs.version }}.zip** - Full distribution (EXE + custom runtime)
            - **UsbThief-${{ needs.build.outputs.version }}.exe** - Standalone executable

            ### System Requirements
            - Windows 7 or later (64-bit)
            - No Java installation required (custom JRE included)

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          files: |
            ./artifacts/UsbThief-*.exe
            ./artifacts/UsbThief-*.zip
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
