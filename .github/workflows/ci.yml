name: CI

on:
  push:
    branches: [ master, java11 ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ master, java11 ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        if: github.ref == 'refs/heads/java11' || github.base_ref == 'java11'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: 'maven'

      - name: Setup Java 25
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
          cache: 'maven'

      - name: Build
        run: mvn clean package -B

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload EXE artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: UsbThief-exe
          path: target/UsbThief-*.exe
          retention-days: 14

      - name: Upload ZIP artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: UsbThief-zip
          path: target/UsbThief-*.zip
          retention-days: 14
