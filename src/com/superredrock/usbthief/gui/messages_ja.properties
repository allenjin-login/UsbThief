# ==== P4-B dialog humanization (UI-01/04/05/06/08/13/14/16) ====

config.entry.corePoolSize.label=Core threads
config.entry.corePoolSize.hint=Number of threads the pool keeps ready even when idle. Too small makes copy tasks wait, too large wastes system resources.
config.entry.corePoolSize.default=Default 2 \u00B7 Range 1-64
config.entry.maxPoolSize.label=Maximum threads
config.entry.maxPoolSize.hint=Upper limit of threads the pool may create. Must be greater than or equal to the core thread count.
config.entry.maxPoolSize.default=Default: number of CPU cores \u00B7 Range 1-256
config.entry.keepAliveTimeSeconds.label=Idle thread keep-alive
config.entry.keepAliveTimeSeconds.hint=How long an idle extra thread waits for new work before it is released. Too large delays freeing resources.
config.entry.keepAliveTimeSeconds.default=Default 60 \u00B7 Range 1-3600 \u00B7 seconds
config.entry.taskQueueCapacity.label=Task queue capacity
config.entry.taskQueueCapacity.hint=Maximum number of pending copy tasks. New tasks are rejected once the queue is full.
config.entry.taskQueueCapacity.default=Default 1024 \u00B7 Range 1-1000000
config.entry.initialDelaySeconds.label=Initial scan delay
config.entry.initialDelaySeconds.hint=Delay after startup before the first device scan, giving the system time to enumerate devices.
config.entry.initialDelaySeconds.default=Default 10 \u00B7 Range 1-600 \u00B7 seconds
config.entry.delaySeconds.label=Device scan interval
config.entry.delaySeconds.hint=Time between two device scans. Smaller values detect devices sooner but use more CPU.
config.entry.delaySeconds.default=Default 500 \u00B7 Range 50-10000 \u00B7 milliseconds
config.entry.bufferSize.label=Copy buffer size
config.entry.bufferSize.hint=Bytes per read/write operation. Usually best left at the default; too small slows copying down.
config.entry.bufferSize.default=Default 1048576 (1 MB) \u00B7 bytes
config.entry.hashBufferSize.label=Hash buffer size
config.entry.hashBufferSize.hint=Bytes read at a time when computing checksums for duplicate detection.
config.entry.hashBufferSize.default=Default 1024 \u00B7 bytes
config.entry.maxFileSize.label=Maximum copy size
config.entry.maxFileSize.hint=Files larger than this are never queued for copying. Value is in bytes.
config.entry.maxFileSize.default=Default 1048576000 (~1000 MB) \u00B7 bytes
config.entry.retryCount.label=Retry attempts
config.entry.retryCount.hint=How many times a failed copy is retried. 0 means never retry.
config.entry.retryCount.default=Default 5 \u00B7 Range 0-100
config.entry.timeoutMillis.label=Retry queue poll interval
config.entry.timeoutMillis.hint=How often the retry queue is checked for new work. Too small increases CPU usage.
config.entry.timeoutMillis.default=Default 100 \u00B7 milliseconds
config.entry.copyVerifyEnabled.label=Pre-copy verification
config.entry.copyVerifyEnabled.hint=Checks the index for duplicates before copying. Turning it off is slightly faster but may create duplicate files.
config.entry.hashAlgorithm.label=Hash algorithm
config.entry.hashAlgorithm.hint=Algorithm used for duplicate detection: SHA-256, MD5, CRC-8, CRC-16, CRC-32 or CRC-64. SHA-256 is recommended.
config.entry.watchEnabled.label=Real-time file watching
config.entry.watchEnabled.hint=Continuously watches connected devices and triggers a copy once enough files have changed.
config.entry.watchThreshold.label=Changes before copying
config.entry.watchThreshold.hint=Number of file changes that triggers a copy. Smaller values copy sooner.
config.entry.watchThreshold.default=Default 10 \u00B7 Range 1-1000
config.entry.watchResetIntervalSeconds.label=Counter reset interval
config.entry.watchResetIntervalSeconds.hint=Idle time after which the change counter goes back to zero.
config.entry.watchResetIntervalSeconds.default=Default 60 \u00B7 Range 1-3600 \u00B7 seconds
config.entry.overwriteStrategy.label=Existing-file handling
config.entry.overwriteStrategy.hint=What to do when the target file already exists: overwrite, skip, or rename automatically.
config.entry.copyReadRateLimit.label=Read rate limit
config.entry.copyReadRateLimit.hint=Caps how fast data is read from the device. 0 means no limit.
config.entry.copyReadRateLimit.default=Default 0 (unlimited) \u00B7 bytes/second
config.entry.copyWriteRateLimit.label=Write rate limit
config.entry.copyWriteRateLimit.hint=Caps how fast data is written to disk. 0 means no limit.
config.entry.copyWriteRateLimit.default=Default 0 (unlimited) \u00B7 bytes/second
config.entry.copyRateBurstSize.label=Rate burst size
config.entry.copyRateBurstSize.hint=Burst allowance used together with the rate limits.
config.entry.copyRateBurstSize.default=Default 16777216 (16 MB) \u00B7 bytes
config.entry.storage.reservedBytes.label=Reserved free space
config.entry.storage.reservedBytes.hint=Free space kept on disk. Cleanup starts once free space drops below this value.
config.entry.storage.reservedBytes.default=Default 10737418240 (10 GB) \u00B7 bytes
config.entry.storage.maxBytes.label=Maximum storage footprint
config.entry.storage.maxBytes.hint=Total space copied files may occupy. Cleanup starts once it is exceeded.
config.entry.storage.maxBytes.default=Default 107374182400 (100 GB) \u00B7 bytes
config.entry.sniffer.waitNormalMinutes.label=Wait after a normal finish
config.entry.sniffer.waitNormalMinutes.hint=Idle time before the device is watched again after a successful copy.
config.entry.sniffer.waitNormalMinutes.default=Default 30 \u00B7 minutes
config.entry.sniffer.waitErrorMinutes.label=Wait after an error
config.entry.sniffer.waitErrorMinutes.hint=Idle time before the device is watched again after an error.
config.entry.sniffer.waitErrorMinutes.default=Default 5 \u00B7 minutes
config.entry.recycler.strategy.label=Cleanup strategy
config.entry.recycler.strategy.hint=Deletion order when space runs low: TIME_FIRST, SIZE_FIRST or AUTO (chosen automatically).
config.entry.recycler.protectedAgeHours.label=New-file protection
config.entry.recycler.protectedAgeHours.hint=Files newer than this are never deleted automatically.
config.entry.recycler.protectedAgeHours.default=Default 1 \u00B7 hours
config.entry.storage.warningEnabled.label=Log storage warnings
config.entry.storage.warningEnabled.hint=Writes a warning to the log when disk space is critical.
config.entry.storage.enabled.label=Storage management
config.entry.storage.enabled.hint=Enables disk-space monitoring, automatic cleanup and space checks.
config.entry.gui.autoStartEnabled.label=Launch at login
config.entry.gui.autoStartEnabled.hint=Starts the application automatically after signing in.
config.entry.gui.showInTaskbar.label=Show window in taskbar
config.entry.gui.showInTaskbar.hint=Uncheck to hide the window from the taskbar.
config.entry.gui.closeAction.label=Behaviour when closing
config.entry.gui.closeAction.hint=What happens when the main window is closed: ASK, MINIMIZE_TO_TRAY or EXIT.
config.entry.gui.closeActionRemember.label=Remember the close choice
config.entry.gui.closeActionRemember.hint=Uncheck to be asked again next time the window is closed.
config.entry.fileFilter.maxSize.label=Ignore files larger than
config.entry.fileFilter.maxSize.hint=Value in bytes. Same setting as the size filter in the File Filter Settings dialog.
config.entry.fileFilter.maxSize.default=Default 104857600 (100 MB) \u00B7 bytes
config.entry.fileFilter.maxSizeEnabled.label=Enable size filter
config.entry.fileFilter.maxSizeEnabled.hint=When enabled, files above the limit are skipped instead of copied.
config.entry.fileFilter.timeEnabled.label=Enable modified-time filter
config.entry.fileFilter.timeEnabled.hint=When enabled, only recently modified files are copied.
config.entry.fileFilter.timeValue.label=Time range value
config.entry.fileFilter.timeValue.hint=Used together with the time range unit: files modified within the last N units are copied.
config.entry.fileFilter.timeValue.default=Default 24 \u00B7 unit set below
config.entry.fileFilter.timeUnit.label=Time range unit
config.entry.fileFilter.timeUnit.hint=One of: HOURS, DAYS, WEEKS, MONTHS or YEARS.
config.entry.fileFilter.includeHidden.label=Include hidden files
config.entry.fileFilter.includeHidden.hint=Files whose name starts with a dot count as hidden.
config.entry.fileFilter.skipSymlinks.label=Ignore shortcuts and links
config.entry.fileFilter.skipSymlinks.hint=Link targets are not scanned, so linked content is not copied twice.
config.entry.fileFilter.allowNoExtension.label=Keep files without extension
config.entry.fileFilter.allowNoExtension.hint=Uncheck to skip files that have no extension.
config.entry.indexCacheSize.label=Index cache size
config.entry.indexCacheSize.hint=In-memory duplicate-index capacity. Larger values query the disk less but use more memory.
config.entry.indexCacheSize.default=Default 2000 \u00B7 entries
config.entry.workPath.label=Working directory
config.entry.workPath.hint=Folder where copied files are stored. Relative paths are resolved against the program folder.
config.entry.stats.api.enabled.label=Statistics HTTP API
config.entry.stats.api.enabled.hint=Serves statistics over HTTP so other programs can read them.
config.entry.stats.api.port.label=Statistics API port
config.entry.stats.api.port.hint=TCP port the statistics API listens on.
config.entry.stats.api.port.default=Default 8421 \u00B7 Range 1024-65535
config.entry.suffixFilter.mode.label=Extension filter mode
config.entry.suffixFilter.mode.hint=NONE (no filtering), WHITELIST (only listed extensions) or BLACKLIST (everything but listed extensions).
config.entry.suffixFilter.whitelist.label=Extension whitelist
config.entry.suffixFilter.whitelist.hint=Only these extensions are copied. Semicolon separated, without dots (e.g. jpg;png).
config.entry.suffixFilter.blacklist.label=Extension blacklist
config.entry.suffixFilter.blacklist.hint=These extensions are never copied. Semicolon separated, without dots.
config.entry.suffixFilter.preset.label=Selected preset
config.entry.suffixFilter.preset.hint=Name of the extension preset; empty means no preset is used.
config.entry.fileHistoryMaxEntries.label=File history size
config.entry.fileHistoryMaxEntries.hint=Maximum number of file-history records kept in memory.
config.entry.fileHistoryMaxEntries.default=Default 10000 \u00B7 entries
config.entry.deviceBlacklist.label=Device blacklist (by path)
config.entry.deviceBlacklist.hint=Deprecated. Use the serial-number list instead.
config.entry.deviceBlacklistBySerial.label=Device blacklist (by serial)
config.entry.deviceBlacklistBySerial.hint=Devices with these serial numbers are ignored. Semicolon separated.
