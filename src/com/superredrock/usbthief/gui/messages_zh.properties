# ==== P4-B dialog humanization (UI-01/04/05/06/08/13/14/16) ====

config.entry.corePoolSize.label=核心线程数
config.entry.corePoolSize.hint=线程池长期保持的线程数量。设置过小会让拷贝任务排队等待，过大则会占用更多系统资源。建议保持默认值。
config.entry.corePoolSize.default=默认 2 · 范围 1–64 · 单位：个
config.entry.maxPoolSize.label=最大线程数
config.entry.maxPoolSize.hint=线程池允许同时运行的最大线程数，不能小于「核心线程数」。与核心线程数相同时线程池没有弹性。
config.entry.maxPoolSize.default=默认 本机 CPU 核心数 · 范围 1–256 · 单位：个
config.entry.keepAliveTimeSeconds.label=空闲线程存活时间
config.entry.keepAliveTimeSeconds.hint=超出核心线程数的空闲线程在退出前等待新任务的最长时间。数值过大会延迟资源释放。
config.entry.keepAliveTimeSeconds.default=默认 60 · 范围 1–3600 · 单位：秒
config.entry.taskQueueCapacity.label=任务队列容量
config.entry.taskQueueCapacity.hint=等待执行的拷贝任务最多排队多少个。队列满后新任务会被拒绝，容量过大会延迟任务开始时间。
config.entry.taskQueueCapacity.default=默认 1024 · 范围 1–1000000 · 单位：个
config.entry.initialDelaySeconds.label=首次扫描延迟
config.entry.initialDelaySeconds.hint=程序启动后等待多久开始第一次设备扫描，留出时间让系统完成设备枚举。
config.entry.initialDelaySeconds.default=默认 10 · 范围 1–600 · 单位：秒
config.entry.delaySeconds.label=设备扫描间隔
config.entry.delaySeconds.hint=两次设备扫描之间的等待时间。数值越小发现设备越快，但占用 CPU 越多。
config.entry.delaySeconds.default=默认 500 · 范围 50–10000 · 单位：毫秒
config.entry.bufferSize.label=拷贝缓冲区大小
config.entry.bufferSize.hint=每次读写文件使用的缓冲区字节数。通常保持默认即可，设置过小会明显降低拷贝速度。
config.entry.bufferSize.default=默认 1048576（1 MB） · 单位：字节
config.entry.hashBufferSize.label=校验缓冲区大小
config.entry.hashBufferSize.hint=计算文件校验值时每次读取的字节数，影响去重校验的速度。
config.entry.hashBufferSize.default=默认 1024 · 单位：字节
config.entry.maxFileSize.label=最大拷贝文件大小
config.entry.maxFileSize.hint=超过此大小的文件不会进入拷贝队列。单位为字节。
config.entry.maxFileSize.default=默认 1048576000（约 1000 MB） · 单位：字节
config.entry.retryCount.label=失败重试次数
config.entry.retryCount.hint=单个文件拷贝失败后最多重试的次数，0 表示不重试。
config.entry.retryCount.default=默认 5 · 范围 0–100 · 单位：次
config.entry.timeoutMillis.label=重试队列轮询间隔
config.entry.timeoutMillis.hint=重试队列检查是否有新任务的轮询间隔，数值过小会增加 CPU 占用。
config.entry.timeoutMillis.default=默认 100 · 单位：毫秒
config.entry.copyVerifyEnabled.label=拷贝前校验
config.entry.copyVerifyEnabled.hint=开启后先在索引中校验文件是否已拷贝过（去重），避免重复拷贝；关闭可略微提速，但可能产生重复文件。
config.entry.hashAlgorithm.label=哈希算法
config.entry.hashAlgorithm.hint=用于去重比对的校验算法，可选：SHA-256、MD5、CRC-8、CRC-16、CRC-32、CRC-64。建议使用 SHA-256。
config.entry.delayCopy.enabled.label=延迟复制
config.entry.delayCopy.enabled.hint=拷贝前先等文件停止变化，避免把仍在写入的文件拷成半截文件（数据损坏）。
config.entry.delayCopy.stableMillis.label=文件稳定等待时间
config.entry.delayCopy.stableMillis.hint=文件保持不变多久之后才开始拷贝。数值越大越稳妥（适合慢速设备），越小则开始拷贝越快。
config.entry.delayCopy.stableMillis.default=默认 400 · 范围 50–10000 · 单位：毫秒
config.entry.watchEnabled.label=启用实时文件监控
config.entry.watchEnabled.hint=开启后持续监控设备上的文件变化，变化数量达到阈值时自动触发拷贝。
config.entry.watchThreshold.label=触发拷贝的文件变化数
config.entry.watchThreshold.hint=累计多少个文件发生变化后触发一次拷贝，数值越小拷贝越及时。
config.entry.watchThreshold.default=默认 10 · 范围 1–1000 · 单位：个
config.entry.watchResetIntervalSeconds.label=变化计数重置间隔
config.entry.watchResetIntervalSeconds.hint=超过该时间没有新的文件变化时，变化计数清零。
config.entry.watchResetIntervalSeconds.default=默认 60 · 范围 1–3600 · 单位：秒
config.entry.overwriteStrategy.label=同名文件处理方式
config.entry.overwriteStrategy.hint=目标位置已存在同名文件时的处理方式：覆盖、跳过、或自动重命名。
config.entry.categoryMode.label=复制文件按类别归档
config.entry.categoryMode.hint=复制到“卷标_序列号”目录下的文件如何归档：保持现状、按文件类型归类（图片/视频/音乐…），或按复制日期归类（yyyy-MM-dd）。
config.entry.copyReadRateLimit.label=读取速度上限
config.entry.copyReadRateLimit.hint=限制从设备读取数据的速度，0 表示不限制。设置过小会明显拖慢拷贝。
config.entry.copyReadRateLimit.default=默认 0（不限速） · 单位：字节/秒
config.entry.copyWriteRateLimit.label=写入速度上限
config.entry.copyWriteRateLimit.hint=限制向磁盘写入数据的速度，0 表示不限制。
config.entry.copyWriteRateLimit.default=默认 0（不限速） · 单位：字节/秒
config.entry.copyRateBurstSize.label=限速突发大小
config.entry.copyRateBurstSize.hint=限速时允许一次性突发的数据量，用于兼顾限速与吞吐。
config.entry.copyRateBurstSize.default=默认 16777216（16 MB） · 单位：字节
config.entry.storage.reservedBytes.label=保留可用空间
config.entry.storage.reservedBytes.hint=磁盘至少保留的剩余空间，低于该值时开始自动清理。数值不要大于磁盘总容量。
config.entry.storage.reservedBytes.default=默认 10737418240（10 GB） · 单位：字节
config.entry.storage.maxBytes.label=允许占用的最大空间
config.entry.storage.maxBytes.hint=拷贝文件合计允许占用的最大磁盘空间，超出后触发清理。
config.entry.storage.maxBytes.default=默认 107374182400（100 GB） · 单位：字节
config.entry.sniffer.waitNormalMinutes.label=正常完成后的等待时间
config.entry.sniffer.waitNormalMinutes.hint=一次拷贝正常结束后，等待多久再重新开始监控该设备。
config.entry.sniffer.waitNormalMinutes.default=默认 30 · 单位：分钟
config.entry.sniffer.waitErrorMinutes.label=出错后的等待时间
config.entry.sniffer.waitErrorMinutes.hint=拷贝出错后等待多久再重新开始监控该设备。
config.entry.sniffer.waitErrorMinutes.default=默认 5 · 单位：分钟
config.entry.recycler.strategy.label=清理策略
config.entry.recycler.strategy.hint=空间不足时的清理顺序：TIME_FIRST（先清理最旧）、SIZE_FIRST（先清理最大）、AUTO（自动选择）。
config.entry.recycler.protectedAgeHours.label=新文件保护时长
config.entry.recycler.protectedAgeHours.hint=最近多少小时内新增的文件不会被自动清理，避免刚拷贝的文件被删除。
config.entry.recycler.protectedAgeHours.default=默认 1 · 单位：小时
config.entry.storage.warningEnabled.label=空间不足时记录警告
config.entry.storage.warningEnabled.hint=磁盘空间不足时写入警告日志，便于排查。
config.entry.storage.enabled.label=启用存储管理
config.entry.storage.enabled.hint=开启磁盘空间监控、自动清理与空间检查。
config.entry.gui.autoStartEnabled.label=开机自动启动
config.entry.gui.autoStartEnabled.hint=登录 Windows 后自动运行本程序。
config.entry.gui.showInTaskbar.label=在任务栏显示窗口
config.entry.gui.showInTaskbar.hint=取消勾选后窗口不会出现在任务栏中。
config.entry.gui.closeAction.label=关闭窗口时的行为
config.entry.gui.closeAction.hint=关闭主窗口时的处理方式：ASK（每次询问）、MINIMIZE_TO_TRAY（最小化到托盘）、EXIT（直接退出）。
config.entry.gui.closeActionRemember.label=记住关闭方式的选择
config.entry.gui.closeActionRemember.hint=勾选后不再每次询问关闭方式，直接使用上次的选择。
config.entry.fileFilter.maxSize.label=忽略大于此大小的文件
config.entry.fileFilter.maxSize.hint=单位：字节。此设置与「文件过滤设置」对话框中的大小过滤是同一项。
config.entry.fileFilter.maxSize.default=默认 104857600（100 MB） · 单位：字节
config.entry.fileFilter.maxSizeEnabled.label=启用文件大小过滤
config.entry.fileFilter.maxSizeEnabled.hint=开启后，超过大小上限的文件会被跳过而不会拷贝。
config.entry.fileFilter.timeEnabled.label=启用修改时间过滤
config.entry.fileFilter.timeEnabled.hint=开启后只拷贝最近修改过的文件，较早的文件会被跳过。
config.entry.fileFilter.timeValue.label=时间范围数值
config.entry.fileFilter.timeValue.hint=与「时间范围单位」配合使用，表示“最近 N 个时间单位内修改过的文件”。
config.entry.fileFilter.timeValue.default=默认 24 · 单位：由「时间范围单位」决定
config.entry.fileFilter.timeUnit.label=时间范围单位
config.entry.fileFilter.timeUnit.hint=取值：HOURS（小时）、DAYS（天）、WEEKS（周）、MONTHS（月）、YEARS（年）。
config.entry.fileFilter.includeHidden.label=包含隐藏文件
config.entry.fileFilter.includeHidden.hint=勾选后连隐藏文件一起拷贝。以“.”开头的文件名视为隐藏文件。
config.entry.fileFilter.skipSymlinks.label=忽略快捷方式与链接
config.entry.fileFilter.skipSymlinks.hint=勾选后不扫描快捷方式或链接所指向的内容，避免同一份内容被重复拷贝。
config.entry.fileFilter.allowNoExtension.label=允许无扩展名文件
config.entry.fileFilter.allowNoExtension.hint=取消勾选后将跳过没有扩展名的文件。
config.entry.indexCacheSize.label=索引缓存条数上限
config.entry.indexCacheSize.hint=内存中保留的去重索引记录条数上限，数值越大越省磁盘查询，但占用更多内存。
config.entry.indexCacheSize.default=默认 2000 · 单位：条
config.entry.workPath.label=工作目录
config.entry.workPath.hint=存放拷贝文件的目录，可填相对路径（相对于程序目录）或绝对路径。
config.entry.stats.api.enabled.label=启用统计接口
config.entry.stats.api.enabled.hint=开启后通过 HTTP 对外提供统计数据，供其他程序读取。
config.entry.stats.api.port.label=统计接口端口
config.entry.stats.api.port.hint=统计接口监听的 TCP 端口号，请避免与其它程序冲突。
config.entry.stats.api.port.default=默认 8421 · 范围 1024–65535
config.entry.suffixFilter.mode.label=扩展名过滤方式
config.entry.suffixFilter.mode.hint=取值：NONE（不过滤）、WHITELIST（只拷贝列表中的扩展名）、BLACKLIST（不拷贝列表中的扩展名）。
config.entry.suffixFilter.whitelist.label=扩展名白名单
config.entry.suffixFilter.whitelist.hint=只拷贝这些扩展名的文件。多个值用分号分隔，不要带点号（例如 jpg;png）。
config.entry.suffixFilter.blacklist.label=扩展名黑名单
config.entry.suffixFilter.blacklist.hint=不拷贝这些扩展名的文件。多个值用分号分隔，不要带点号。
config.entry.suffixFilter.preset.label=已选的预设
config.entry.suffixFilter.preset.hint=扩展名预设名称，留空表示未使用预设。
config.entry.fileHistoryMaxEntries.label=文件历史保留条数
config.entry.fileHistoryMaxEntries.hint=内存中保留的文件历史记录条数上限，超出后最早的记录会被丢弃。
config.entry.fileHistoryMaxEntries.default=默认 10000 · 单位：条
config.entry.deviceBlacklist.label=设备黑名单（按路径）
config.entry.deviceBlacklist.hint=已废弃，请改用「设备黑名单（按序列号）」。
config.entry.deviceBlacklistBySerial.label=设备黑名单（按序列号）
config.entry.deviceBlacklistBySerial.hint=这些序列号的设备不会被扫描或拷贝。多个值用分号分隔。
config.button.resetAll=重置全部设置…
config.button.resetAll.tooltip=将全部页面的设置恢复为默认值（不只是当前页）
config.validation.maxPoolSize=「最大线程数」不能小于「核心线程数」，请修改线程池设置。
config.validation.title=设置无效
config.option.overwriteStrategy.ALWAYS_OVERWRITE=覆盖已有文件
config.option.overwriteStrategy.SKIP=跳过（保留已有文件）
config.option.overwriteStrategy.RENAME=自动重命名
config.option.categoryMode.OFF=关闭（保持现状）
config.option.categoryMode.BY_TYPE=按文件类型
config.option.categoryMode.BY_DATE=按复制日期
