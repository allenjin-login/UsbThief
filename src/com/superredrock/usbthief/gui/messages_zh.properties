blacklist.count=共 {0} 台设备
blacklist.empty.title=暂无屏蔽设备
blacklist.empty.text=可在设备列表中点击“加入黑名单”来屏蔽设备。
blacklist.button.remove.tooltip=从黑名单中移除选中的设备
blacklist.button.clear.tooltip=清空黑名单（需要确认）
filter.basic.maxSize.tooltip=开启后，超过该大小的文件会被跳过而不会拷贝。可拖动滑块，也可在右侧数字框中直接输入。
filter.basic.time.tooltip=按文件的“修改时间”判断：只拷贝最近这段时间内修改过的文件，更早的文件会被跳过。
filter.basic.includeHidden.tooltip=勾选后连隐藏文件一起拷贝。此处“隐藏”指文件名以“.”开头。
filter.basic.skipSymlinks.tooltip=勾选后不扫描快捷方式/链接所指向的内容，避免同一份内容被重复拷贝。
filter.basic.size.unit.hint=单位
filter.suffix.hint=白名单：只拷贝列表中的扩展名；黑名单：列表中以外的扩展名都会拷贝。
filter.slider.unit.hours=时
filter.slider.unit.days=天
filter.slider.unit.weeks=周
filter.slider.unit.months=月
filter.slider.unit.years=年
